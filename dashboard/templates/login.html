<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ system_name }} - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 30%),
                radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.20), transparent 35%),
                linear-gradient(135deg, #0f172a, #1d4ed8);
            padding: 20px;
        }

        .box {
            width: 460px;
            background: rgba(255, 255, 255, 0.96);
            padding: 36px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.22);
            backdrop-filter: blur(10px);
        }

        .badge {
            width: fit-content;
            margin: 0 auto 16px auto;
            padding: 8px 14px;
            border-radius: 999px;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 13px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0f172a;
            font-size: 34px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: 0.2s ease;
            background: #f9fafb;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.10);
            background: white;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #1e3a8a, #4338ca);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            margin-top: 8px;
            transition: 0.2s ease;
            box-shadow: 0 10px 25px rgba(67, 56, 202, 0.22);
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.97;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .footer-text {
            text-align: center;
            margin-top: 18px;
            color: #6b7280;
            font-size: 14px;
        }

        .footer-text a {
            color: #1d4ed8;
            text-decoration: none;
            font-weight: bold;
        }

        .system-name {
            text-align: center;
            margin-top: 14px;
            color: #9ca3af;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .box {
                width: 100%;
                padding: 28px 20px;
            }

            h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="badge">Secure Access</div>
        <h2>System Login</h2>
        <div class="subtitle">Sign in to access the monitoring system.</div>

        {% if error_message %}
        <div class="message error">{{ error_message }}</div>
        {% endif %}

        <form method="post" action="/login/">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="footer-text">
            Don’t have an account?
            <a href="/signup/">Create Account</a>
        </div>

        <div class="system-name">
            {{ system_name }}
        </div>
    </div>
</body>
</html>
