<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 30%),
                radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.20), transparent 35%),
                linear-gradient(135deg, #0f172a, #1d4ed8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .box {
            width: 650px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0f172a;
            font-size: 34px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            background: #e0f2fe;
            color: #075985;
            text-align: center;
            font-size: 14px;
        }

        .info-box {
            background: #f3f4f6;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            color: #111827;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #1e3a8a, #4338ca);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Request Flood Lab</h2>
        <div class="subtitle">
            Simulate local request flooding in a safe lab environment.
        </div>

        {% if success_message %}
        <div class="message">{{ success_message }}</div>
        {% endif %}

        <div class="info-box">
            Detection threshold: <strong>{{ threshold }}</strong> requests or more.
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Number of simulated requests</label>
                <input type="number" name="request_count" min="1" max="500" placeholder="Enter simulated request count" required>
            </div>
            <button type="submit" class="btn">Run Flood Simulation</button>
        </form>

        <a class="back-link" href="/">Back to Dashboard</a>
    </div>
</body>
</html>
